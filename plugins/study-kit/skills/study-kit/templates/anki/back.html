<div class="sk">
  <div class="sk-badges">
    <span class="sk-badge sk-type">{{Type}}</span>
    <span class="sk-badge sk-level sk-{{Level}}">{{Level}}</span>
  </div>
  <div class="sk-front">{{Front}}</div>
  {{#Media}}<div class="sk-media">{{Media}}</div>{{/Media}}
  <hr id="answer">
  <div class="sk-back">{{Back}}</div>
  {{#Explanation}}<div class="sk-expl">{{Explanation}}</div>{{/Explanation}}
  <div class="sk-meta">
    {{#Objective}}<div class="sk-obj"><span class="sk-label">Objective</span> {{Objective}}</div>{{/Objective}}
    {{#Source}}<div class="sk-src">{{Source}}</div>{{/Source}}
  </div>
</div>

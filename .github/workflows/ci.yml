name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Validate example
        run: python plugins/study-kit/skills/study-kit/scripts/validate.py examples/study-kit/tiny-linear-models --strict

  pages:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python plugins/study-kit/skills/study-kit/scripts/build_site.py examples/study-kit/tiny-linear-models --no-vendor
      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples/study-kit/tiny-linear-models/site
      - id: deploy
        uses: actions/deploy-pages@v4

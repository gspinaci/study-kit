name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build assets
        run: |
          B=examples/study-kit/tiny-linear-models
          S=plugins/study-kit/skills/study-kit/scripts
          python $S/build_deck.py $B --out example-deck.apkg
          python $S/build_site.py $B --no-vendor
          (cd plugins/study-kit/skills && zip -r ../../../study-kit-skill.zip study-kit -x '*/__pycache__/*')
          (cd $B/site && zip -r ../../../../example-site.zip .)
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            study-kit-skill.zip
            example-deck.apkg
            example-site.zip
